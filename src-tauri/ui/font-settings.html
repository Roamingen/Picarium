<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>界面字体</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { overflow: hidden; }
    body { background: var(--bg); }

    .fw-shell { height: 100vh; display: flex; flex-direction: column; min-width: 0; }

    .fw-head {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-2);
    }
    .fw-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .fw-logo {
      width: 30px; height: 30px; flex: none;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px; background: var(--surface-2); color: var(--accent);
      font-size: 15px; font-weight: 600;
    }
    .fw-title { font-size: 15px; font-weight: 600; }
    .fw-sub { margin-top: 2px; color: var(--dim); font-size: 10.5px; }
    .fw-head .btn { padding: 6px 12px; }
    .fw-dirty { font-size: 10.5px; color: var(--dim); margin-right: 2px; }

    .fw-main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 330px;
    }

    .fw-roles {
      overflow: auto;
      padding: 14px 12px;
      border-right: 1px solid var(--line);
      background: var(--bg-2);
    }
    .fw-side-label {
      margin: 0 4px 8px;
      color: var(--dim);
      font-size: 10.5px;
      letter-spacing: 0.08em;
    }
    .fw-role {
      width: 100%;
      display: block;
      margin-bottom: 6px;
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      text-align: left;
      font: inherit;
    }
    .fw-role:hover { background: var(--surface-2); }
    .fw-role.on { background: var(--active); border-color: var(--accent); }
    .fw-role-top { display: flex; align-items: center; gap: 6px; }
    .fw-role-name { font-size: 12.5px; font-weight: 600; }
    .fw-role-badge {
      padding: 1px 5px;
      border: 1px solid var(--line-2);
      border-radius: 999px;
      color: var(--dim);
      font-size: 9px;
      line-height: 1.4;
    }
    .fw-role.on .fw-role-badge { color: var(--accent); border-color: var(--accent); }
    .fw-role-sum {
      margin-top: 3px;
      color: var(--dim);
      font-size: 10.5px;
      line-height: 1.45;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .fw-side-note {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--dim-2);
      font-size: 10.5px;
      line-height: 1.65;
    }

    .fw-form { min-width: 0; overflow: auto; padding: 16px 20px 28px; }
    .fw-form-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .fw-form-head h2 { margin: 0; font-size: 16px; }
    .fw-form-head p { margin: 3px 0 0; color: var(--dim); font-size: 10.5px; }
    .fw-follow {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--dim);
      font-size: 10.5px;
      cursor: pointer;
      white-space: nowrap;
    }
    .fw-follow input { accent-color: var(--accent); }
    .fw-follow[hidden] { display: none !important; }

    fieldset.fw-fields { margin: 0; padding: 0; border: 0; min-width: 0; }
    fieldset.fw-fields[disabled] { opacity: 0.62; }

    .fw-field { padding: 10px 0; border-bottom: 1px solid var(--line-3); }
    .fw-field:last-child { border-bottom: none; }
    .fw-label-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px; }
    .fw-label { font-size: 11.5px; font-weight: 600; }
    .fw-hint { color: var(--dim); font-size: 10.5px; }
    .fw-hint.right { margin-left: auto; }

    .fw-font {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--fg);
      cursor: pointer;
      text-align: left;
      font: inherit;
    }
    .fw-font:hover { border-color: var(--accent); }
    .fw-font .nm {
      min-width: 0;
      font-size: 13px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .fw-font .sample {
      margin-left: auto;
      flex: none;
      color: var(--dim);
      font-size: 12px;
      white-space: nowrap;
    }
    .fw-font .arrow { flex: none; color: var(--dim-2); font-size: 16px; }
    .fw-font:disabled { opacity: 0.55; cursor: default; }

    .fw-warn {
      display: none;
      margin-top: 6px;
      padding: 5px 7px;
      border: 1px solid rgba(232, 180, 90, 0.28);
      border-radius: 6px;
      background: rgba(232, 180, 90, 0.08);
      color: var(--warn);
      font-size: 10.5px;
    }
    .fw-warn.on { display: block; }

    .fw-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .fw-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 3px 2px 6px;
      border: 1px solid var(--line-2);
      border-radius: 6px;
      background: var(--surface-2);
      font-size: 10.5px;
    }
    .fw-chip .ix { color: var(--dim); font-size: 9px; }
    .fw-chip button {
      border: 0;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      padding: 0 2px;
      font-size: 10px;
      line-height: 1.4;
    }
    .fw-chip button:hover { color: var(--fg); }
    .fw-add {
      padding: 2px 8px;
      border: 1px dashed var(--line-2);
      border-radius: 6px;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      font-size: 10.5px;
    }
    .fw-add:hover { color: var(--fg); border-color: var(--accent); }
    .fw-add:disabled { opacity: 0.4; cursor: default; }
    .fw-empty { color: var(--dim-2); font-size: 10.5px; padding: 3px 0; }

    .fw-range-row { display: flex; align-items: center; gap: 10px; }
    .fw-range-row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); height: 16px; }
    .fw-val {
      min-width: 50px;
      padding: 2px 5px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--fg);
      text-align: right;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .fw-quick { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .fw-qbtn, .fw-qbtn-static {
      padding: 1px 7px;
      border: 1px solid var(--line-2);
      border-radius: 5px;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      font-size: 10px;
    }
    .fw-qbtn:hover { color: var(--fg); border-color: var(--accent); }
    .fw-qbtn.on { color: var(--accent); border-color: var(--accent); background: var(--sel-tint); }
    .fw-qbtn-static { cursor: default; }

    .fw-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .fw-select, .fw-input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--fg);
      font: inherit;
      font-size: 11px;
      outline: none;
    }
    .fw-select:focus, .fw-input:focus { border-color: var(--accent); }
    .fw-note { margin: 5px 0 0; color: var(--dim-2); font-size: 10px; line-height: 1.6; }
    .fw-note b { color: var(--dim); font-weight: 500; }

    .fw-preview {
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--line);
      background: var(--bg-2);
    }
    .fw-pv-head {
      flex: none;
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
    }
    .fw-pv-title { color: var(--dim); font-size: 10.5px; letter-spacing: 0.06em; }
    .fw-pv-meta { margin-left: auto; color: var(--dim-2); font-size: 10px; white-space: nowrap; }
    .fw-pv-stage {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 14px;
    }
    .fw-pv-stage > * { width: 100%; max-width: 300px; }
    .fw-pv-foot {
      flex: none;
      padding: 9px 14px;
      border-top: 1px solid var(--line);
      color: var(--dim-2);
      font-size: 10px;
      line-height: 1.6;
    }

    /* 预览里的迷你界面：所有尺寸用 em，跟着角色字号缩放 */
    .fpv-window {
      overflow: hidden;
      border: 1px solid var(--line-2);
      border-radius: 9px;
      background: var(--surface);
      box-shadow: 0 10px 26px var(--shadow-sm);
    }
    .fpv-titlebar {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0.5em 0.7em;
      border-bottom: 1px solid var(--line);
      background: var(--bg-2);
      color: var(--dim);
      font-size: 0.75em;
    }
    .fpv-dot { width: 0.5em; height: 0.5em; border-radius: 50%; background: var(--accent); }
    .fpv-win { margin-left: auto; letter-spacing: 0.3em; color: var(--dim-2); }
    .fpv-body { display: grid; grid-template-columns: 6.4em minmax(0, 1fr); min-height: 11em; }
    .fpv-side { padding: 0.7em 0.55em; border-right: 1px solid var(--line); background: var(--bg-2); }
    .fpv-side-title { margin: 0.2em 0.4em 0.5em; color: var(--dim); font-size: 0.72em; }
    .fpv-side-row { padding: 0.32em 0.4em; border-radius: 0.35em; color: var(--dim); font-size: 0.78em; }
    .fpv-side-row.on { background: var(--active); color: var(--accent); }
    .fpv-side-row b { float: right; color: var(--dim-2); font-weight: 400; }
    .fpv-tag { margin-top: 0.6em; padding: 0.2em 0.4em; color: var(--dim-2); font-size: 0.72em; }
    .fpv-content { min-width: 0; padding: 0.65em; }
    .fpv-search {
      display: flex;
      align-items: center;
      gap: 0.4em;
      padding: 0.4em 0.5em;
      border: 1px solid var(--line);
      border-radius: 0.4em;
      background: var(--surface-2);
      color: var(--dim);
      font-size: 0.78em;
    }
    .fpv-search kbd { margin-left: auto; font-size: 0.8em; }
    .fpv-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45em; margin-top: 0.55em; }
    .fpv-card { overflow: hidden; border: 1px solid var(--line); border-radius: 0.4em; background: var(--surface); }
    .fpv-thumb { height: 4.8em; background: linear-gradient(135deg, #4c6ef5 0%, #845ef7 45%, #f06595 100%); }
    .fpv-card:nth-child(2) .fpv-thumb { background: linear-gradient(135deg, #f59f00 0%, #fa5252 60%, #e64980 100%); }
    .fpv-card:nth-child(3) .fpv-thumb { background: linear-gradient(135deg, #12b886 0%, #15aabf 55%, #4c6ef5 100%); }
    .fpv-card:nth-child(4) .fpv-thumb { background: linear-gradient(135deg, #868e96 0%, #495057 60%, #212529 100%); }
    .fpv-card-name { padding: 0.3em 0.4em 0.05em; font-size: 0.8em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fpv-card-tag { padding: 0 0.4em 0.35em; color: var(--accent); font-size: 0.7em; }

    .fpv-tip {
      padding: 0.7em 0.8em;
      border: 1px solid var(--line-2);
      border-radius: 0.55em;
      background: var(--surface-3);
      box-shadow: 0 10px 26px var(--shadow-sm);
    }
    .fpv-tip-name { font-size: 1em; font-weight: 600; word-break: break-all; }
    .fpv-tip-row { margin-top: 0.3em; color: var(--dim); font-size: 0.82em; line-height: 1.6; }
    .fpv-tip-tags { margin-top: 0.4em; color: var(--accent); font-size: 0.82em; }
    .fpv-caption { margin-top: 0.5em; color: var(--dim-2); font-size: 0.68em; text-align: center; }

    .fpv-panel {
      overflow: hidden;
      border: 1px solid var(--line-2);
      border-radius: 0.6em;
      background: var(--surface);
      box-shadow: 0 10px 26px var(--shadow-sm);
    }
    .fpv-panel-search {
      display: flex;
      align-items: center;
      gap: 0.5em;
      padding: 0.7em 0.75em;
      border-bottom: 1px solid var(--line);
      color: var(--dim);
      font-size: 0.9em;
    }
    .fpv-panel-search kbd { margin-left: auto; }
    .fpv-panel-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.45em; padding: 0.6em 0.7em; }
    .fpv-panel-card { overflow: hidden; border: 1px solid transparent; border-radius: 0.4em; background: var(--surface-2); }
    .fpv-panel-card:first-child { border-color: var(--accent); }
    .fpv-panel-img { height: 3.7em; background: linear-gradient(135deg, #4c6ef5, #845ef7); }
    .fpv-panel-card:nth-child(2) .fpv-panel-img { background: linear-gradient(135deg, #f59f00, #fa5252); }
    .fpv-panel-card:nth-child(3) .fpv-panel-img { background: linear-gradient(135deg, #12b886, #15aabf); }
    .fpv-panel-foot {
      display: flex;
      gap: 0.8em;
      padding: 0.45em 0.7em 0.55em;
      border-top: 1px solid var(--line);
      color: var(--dim-2);
      font-size: 0.7em;
    }
    .fpv-panel-foot kbd { margin-right: 0.2em; }

    .fpv-mono { display: flex; flex-direction: column; gap: 0.7em; }
    .fpv-mono-block {
      padding: 0.7em 0.8em;
      border: 1px solid var(--line);
      border-radius: 0.5em;
      background: var(--surface);
    }
    .fpv-mono-label { color: var(--dim-2); font-size: 0.68em; margin-bottom: 0.4em; }
    .fpv-mono-line { color: var(--fg); font-size: 0.92em; line-height: 1.6; word-break: break-all; }
    .fpv-mono-line.dim { color: var(--dim); }
    .fpv-mono-line kbd { margin-right: 0.35em; }

    .fw-foot {
      flex: none;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 18px;
      border-top: 1px solid var(--line);
      background: var(--bg-2);
      color: var(--dim);
      font-size: 10.5px;
    }
    .fw-foot .spacer { flex: 1; }
    .fw-foot b { color: var(--dim); font-weight: 500; }

    .fw-picker {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 26px;
      background: var(--mask);
    }
    .fw-picker[hidden] { display: none !important; }
    .fw-picker-card {
      width: min(560px, 100%);
      max-height: min(660px, 88vh);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line-2);
      border-radius: 12px;
      background: var(--modal);
      box-shadow: 0 24px 80px var(--shadow);
      overflow: hidden;
    }
    .fw-picker-head {
      flex: none;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 14px 15px 10px;
      border-bottom: 1px solid var(--line);
    }
    .fw-picker-head h3 { margin: 0; font-size: 14px; }
    .fw-picker-head p { margin: 3px 0 0; color: var(--dim); font-size: 10.5px; }
    .fw-picker-x {
      margin-left: auto;
      width: 26px; height: 26px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
    }
    .fw-picker-x:hover { color: var(--fg); }
    .fw-picker-tools { flex: none; padding: 9px 15px 7px; }
    .fw-picker-tools input[type="text"] {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      color: var(--fg);
      font: inherit;
      font-size: 11.5px;
      outline: none;
    }
    .fw-picker-tools input[type="text"]:focus { border-color: var(--accent); }
    .fw-picker-filter {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      color: var(--dim);
      font-size: 11px;
      cursor: pointer;
    }
    .fw-picker-filter input { width: auto; margin: 0; accent-color: var(--accent); }
    .fw-picker-list { flex: 1; min-height: 0; overflow: auto; padding: 2px 8px 8px; }
    .fw-picker-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 8px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      text-align: left;
      font: inherit;
    }
    .fw-picker-row:hover { background: var(--surface-2); }
    .fw-picker-row.on { background: var(--active); border-color: var(--accent); }
    .fw-picker-row .pn { min-width: 0; font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fw-picker-row .ps { margin-left: auto; flex: none; color: var(--dim); font-size: 11px; white-space: nowrap; }
    .fw-picker-row .pb {
      flex: none;
      padding: 1px 4px;
      border: 1px solid var(--line-2);
      border-radius: 4px;
      color: var(--dim);
      font-size: 9px;
    }
    .fw-picker-empty { padding: 26px 8px; color: var(--dim); text-align: center; font-size: 11px; }
    .fw-picker-manual {
      flex: none;
      display: flex;
      gap: 6px;
      padding: 9px 15px 12px;
      border-top: 1px solid var(--line);
    }
    .fw-picker-manual input {
      flex: 1;
      min-width: 0;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--fg);
      font: inherit;
      font-size: 11px;
      outline: none;
    }
    .fw-picker-manual input:focus { border-color: var(--accent); }
    .fw-toast {
      position: fixed;
      left: 50%;
      bottom: 44px;
      z-index: 120;
      transform: translate(-50%, 8px);
      padding: 7px 14px;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      background: var(--toast-bg);
      color: var(--toast-fg);
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease;
    }
    .fw-toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 900px) {
      .fw-main { grid-template-columns: 190px minmax(0, 1fr) 270px; }
      .fw-form { padding: 12px 14px 24px; }
      .fw-head { padding: 11px 14px; }
      .fw-foot { padding: 7px 14px; }
    }
  </style>
</head>
<body>
  <div class="fw-shell">
    <header class="fw-head">
      <div class="fw-brand">
        <div class="fw-logo">字</div>
        <div>
          <div class="fw-title">界面字体</div>
          <div class="fw-sub">中西文分开 · 回退链 · 按作用范围设置</div>
        </div>
      </div>
      <div class="spacer"></div>
      <span id="fw-dirty" class="fw-dirty"></span>
      <button id="fw-reset" class="btn" type="button">恢复默认</button>
      <button id="fw-cancel" class="btn" type="button">取消</button>
      <button id="fw-apply" class="btn primary" type="button">应用</button>
    </header>

    <main class="fw-main">
      <aside class="fw-roles">
        <div class="fw-side-label">作用范围</div>
        <div id="fw-roles"></div>
        <div class="fw-side-note">
          每个范围独立选择西文、中文字体与回退链。列表和快贴面板默认跟随界面；等宽单独设置。
        </div>
      </aside>

      <section id="fw-form" class="fw-form"></section>

      <aside class="fw-preview">
        <div class="fw-pv-head">
          <span class="fw-pv-title">实时预览</span>
          <span id="fw-pv-meta" class="fw-pv-meta"></span>
        </div>
        <div id="fw-pv" class="fw-pv-stage"></div>
        <div class="fw-pv-foot">预览按实际字号渲染；卡片、网格、控件尺寸不变。</div>
      </aside>
    </main>

    <footer class="fw-foot">
      <span>字体只作用于文字；<b>Nerd Font 与普通字体一样选择</b>，图标只在该字体被选中时显示。</span>
      <div class="spacer"></div>
      <span id="fw-font-count">正在读取系统字体…</span>
    </footer>
  </div>

  <div id="fw-picker" class="fw-picker" hidden>
    <div class="fw-picker-card" role="dialog" aria-modal="true" aria-labelledby="fw-picker-title">
      <div class="fw-picker-head">
        <div>
          <h3 id="fw-picker-title">选择字体</h3>
          <p id="fw-picker-sub">选择后立即预览</p>
        </div>
        <button id="fw-picker-close" class="fw-picker-x" type="button" title="关闭">✕</button>
      </div>
      <div class="fw-picker-tools">
        <input id="fw-picker-q" type="text" placeholder="搜索字体名…" autocomplete="off" spellcheck="false" />
        <label id="fw-picker-cjk-wrap" class="fw-picker-filter" hidden>
          <input id="fw-picker-cjk" type="checkbox" checked />
          只看含中文的字体
        </label>
      </div>
      <div id="fw-picker-list" class="fw-picker-list"></div>
      <div class="fw-picker-manual">
        <input id="fw-manual" type="text" placeholder="找不到？手动输入字体名（如 LXGW WenKai）" autocomplete="off" spellcheck="false" />
        <button id="fw-manual-use" class="btn small" type="button">使用</button>
      </div>
    </div>
  </div>

  <div id="fw-toast" class="fw-toast"></div>

  <script src="font-config.js"></script>
  <script>
    (function () {
      'use strict';
      const { invoke } = window.__TAURI__.core;
      const $ = (id) => document.getElementById(id);

      // 字体窗口里也不弹浏览器原生右键菜单
      document.addEventListener('contextmenu', (e) => e.preventDefault(), true);
      document.addEventListener(
        'mousedown',
        (e) => {
          if (e.button === 1) e.preventDefault();
        },
        true
      );
      const NF_SAMPLE = 'Aa 0123 \u{f07b}';

      const FALLBACK_FONTS = [
        { family: 'Segoe UI', mono: false, cjk: false },
        { family: 'Microsoft YaHei UI', mono: false, cjk: true },
        { family: 'Cascadia Code', mono: true, cjk: false },
        { family: 'Consolas', mono: true, cjk: false },
        { family: 'Noto Sans SC', mono: false, cjk: true },
      ];

      let saved = SBFonts.normalize(null);
      let draft = SBFonts.normalize(null);
      let selected = 'ui';
      let systemFonts = [];
      let pickerTarget = null;
      let pickerItems = [];
      let toastTimer = 0;
      let readingFonts = false;

      function clone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (ch) =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])
        );
      }

      function fontStyle(family) {
        return SBFonts.quote(family).replace(/"/g, '&quot;');
      }

      function isNerd(family) {
        return /nerd/i.test(family);
      }

      function sampleFor(family, cjk) {
        if (isNerd(family)) return NF_SAMPLE;
        return cjk ? '汉字 0123' : 'Aa 0123';
      }

      function allFonts() {
        const seen = new Set();
        const out = [];
        for (const f of systemFonts) {
          const name = f.family || f;
          if (!name || seen.has(name.toLowerCase())) continue;
          seen.add(name.toLowerCase());
          out.push({ family: name, mono: !!f.mono, cjk: !!f.cjk });
        }
        for (const f of FALLBACK_FONTS) {
          if (seen.has(f.family.toLowerCase())) continue;
          seen.add(f.family.toLowerCase());
          out.push(f);
        }
        return out;
      }

      function fontAvailable(family) {
        if (!family) return false;
        if (isNerd(family) && !systemFonts.some((f) => (f.family || f).toLowerCase() === family.toLowerCase())) {
          // NF 字体只有系统里存在时才提示可用；手动输入的普通字体按系统回退显示。
          return false;
        }
        return true;
      }

      function toast(msg) {
        const el = $('fw-toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
      }

      function roleData(id) {
        return draft[id];
      }

      function roleLabel(id) {
        return SBFonts.role(id).name;
      }

      function roleSummary(id) {
        return SBFonts.summary(draft, id);
      }

      function markDirty() {
        const dirty = JSON.stringify(draft) !== JSON.stringify(saved);
        $('fw-dirty').textContent = dirty ? '未应用' : '';
      }

      function renderRoles() {
        const box = $('fw-roles');
        box.innerHTML = SBFonts.ROLES.map((role) => {
          const following = (role.id === 'list' || role.id === 'panel') && draft[role.id].follow;
          return `
            <button class="fw-role ${role.id === selected ? 'on' : ''}" type="button" data-role="${role.id}">
              <div class="fw-role-top">
                <span class="fw-role-name">${escapeHtml(role.name)}</span>
                <span class="fw-role-badge">${following ? '跟随' : (role.id === 'ui' ? '基础' : '独立')}</span>
              </div>
              <div class="fw-role-sum">${escapeHtml(roleSummary(role.id))}</div>
            </button>
          `;
        }).join('');
        box.querySelectorAll('[data-role]').forEach((btn) => {
          btn.addEventListener('click', () => {
            selected = btn.dataset.role;
            renderAll();
          });
        });
      }

      function fontButton(key, label, value, cjk, hint) {
        const missing = value && !fontAvailable(value);
        return `
          <div class="fw-field">
            <div class="fw-label-row">
              <span class="fw-label">${escapeHtml(label)}</span>
              <span class="fw-hint">${escapeHtml(hint || '')}</span>
            </div>
            <button class="fw-font" type="button" data-font="${key}">
              <span class="nm">${escapeHtml(value || '未选择')}</span>
              <span class="sample" style="font-family:${fontStyle(value || 'system-ui')}">${escapeHtml(sampleFor(value || '', cjk))}</span>
              <span class="arrow">›</span>
            </button>
            <div class="fw-warn ${missing ? 'on' : ''}">未在系统中检测到「${escapeHtml(value)}」，会按回退链显示。</div>
          </div>
        `;
      }

      function fallbackHTML() {
        const d = roleData(selected);
        const chips = (d.fallbacks || []).map((name, index) => `
          <span class="fw-chip">
            <span class="ix">${index + 1}</span>
            <span>${escapeHtml(name)}</span>
            <button type="button" data-fb="up" data-i="${index}" title="上移">↑</button>
            <button type="button" data-fb="down" data-i="${index}" title="下移">↓</button>
            <button type="button" data-fb="del" data-i="${index}" title="移除">✕</button>
          </span>
        `).join('');
        const empty = d.fallbacks && d.fallbacks.length ? '' : '<span class="fw-empty">还没有回退字体；系统默认永远兜底</span>';
        return `
          <div class="fw-field">
            <div class="fw-label-row">
              <span class="fw-label">回退字体</span>
              <span class="fw-hint right">按顺序尝试 · 最多 5 个</span>
            </div>
            <div class="fw-chips">
              ${chips}
              ${empty}
              <button class="fw-add" type="button" id="fw-add-fallback" ${d.fallbacks.length >= SBFonts.MAX_FALLBACKS ? 'disabled' : ''}>+ 添加回退字体</button>
            </div>
            <p class="fw-note">中文、符号或 Nerd Font 图标在前面的字体里缺字时，按顺序继续尝试。</p>
          </div>
        `;
      }

      function rangeField(key, label, min, max, step, value, unit, hint) {
        return `
          <div class="fw-field">
            <div class="fw-label-row">
              <span class="fw-label">${escapeHtml(label)}</span>
              <span class="fw-hint right">${escapeHtml(hint || '')}</span>
            </div>
            <div class="fw-range-row">
              <input type="range" data-key="${key}" min="${min}" max="${max}" step="${step}" value="${value}" />
              <span class="fw-val" id="fw-${key}-val">${value}${unit || ''}</span>
            </div>
          </div>
        `;
      }

      function renderForm() {
        const role = SBFonts.role(selected);
        const d = roleData(selected);
        const canFollow = selected === 'list' || selected === 'panel';
        const following = canFollow && d.follow;
        const quickSizes = [12, 13, 14, 15, 16];

        $('fw-form').innerHTML = `
          <div class="fw-form-head">
            <div>
              <h2>${escapeHtml(role.name)}</h2>
              <p>${escapeHtml(role.desc)}</p>
            </div>
            <label class="fw-follow" ${canFollow ? '' : 'hidden'}>
              <input id="fw-follow" type="checkbox" ${following ? 'checked' : ''} />
              跟随界面
            </label>
          </div>
          <fieldset class="fw-fields" ${following ? 'disabled' : ''}>
            ${fontButton('latin', '西文字体', d.latin, false, 'Latin')}
            ${fontButton('cjk', '中文字体', d.cjk, true, 'CJK')}
            ${fallbackHTML()}
            <div class="fw-field">
              <div class="fw-label-row">
                <span class="fw-label">字号</span>
                <span class="fw-hint right">${SBFonts.SIZE_MIN}–${SBFonts.SIZE_MAX}px · 建议 ${SBFonts.SIZE_MAX - 2} 以内</span>
              </div>
              <div class="fw-range-row">
                <input type="range" data-key="size" min="${SBFonts.SIZE_MIN}" max="${SBFonts.SIZE_MAX}" step="0.5" value="${d.size}" />
                <span class="fw-val" id="fw-size-val">${d.size}px</span>
              </div>
              <div class="fw-quick">
                ${quickSizes.map((n) => `<button class="fw-qbtn ${Number(d.size) === n ? 'on' : ''}" type="button" data-quick-size="${n}">${n}</button>`).join('')}
                <span class="fw-qbtn-static">不改卡片 / 网格 / 控件尺寸</span>
              </div>
            </div>
            <div class="fw-field">
              <div class="fw-label-row"><span class="fw-label">行高</span><span class="fw-hint right">1.2–2.0</span></div>
              <div class="fw-range-row">
                <input type="range" data-key="line" min="${SBFonts.LINE_MIN}" max="${SBFonts.LINE_MAX}" step="0.05" value="${d.line}" />
                <span class="fw-val" id="fw-line-val">${d.line.toFixed(2)}</span>
              </div>
            </div>
            <div class="fw-field">
              <div class="fw-label-row"><span class="fw-label">字重</span><span class="fw-hint right">字体本身可能只提供部分字重</span></div>
              <div class="fw-grid2">
                <select class="fw-select" data-key="weight">
                  ${[300, 400, 500, 600, 700].map((w) => `<option value="${w}" ${Number(d.weight) === w ? 'selected' : ''}>${w}${w === 400 ? ' 常规' : w === 600 ? ' 半粗' : w === 700 ? ' 粗体' : ''}</option>`).join('')}
                </select>
                <div class="fw-hint" style="align-self:center">OpenType 特性在下面单独设置</div>
              </div>
            </div>
            <div class="fw-field">
              <div class="fw-label-row"><span class="fw-label">字距</span><span class="fw-hint right">-0.5–2px</span></div>
              <div class="fw-range-row">
                <input type="range" data-key="letter" min="-0.5" max="2" step="0.05" value="${d.letter}" />
                <span class="fw-val" id="fw-letter-val">${d.letter}px</span>
              </div>
            </div>
            <div class="fw-field">
              <div class="fw-label-row"><span class="fw-label">OpenType 特性</span><span class="fw-hint">留空 = 默认</span></div>
              <input class="fw-input" data-key="features" type="text" value="${escapeHtml(d.features)}" placeholder="例：calt, liga" spellcheck="false" />
              <p class="fw-note">等宽字体默认开启 <b>calt, liga</b>；如果字体不支持会静默忽略。</p>
            </div>
          </fieldset>
        `;

        if (canFollow) {
          const toggle = $('fw-follow');
          toggle.addEventListener('change', () => {
            if (toggle.checked) {
              draft[selected].follow = true;
            } else {
              const ui = SBFonts.effective(draft, 'ui');
              draft[selected] = Object.assign({}, draft[selected], {
                follow: false,
                latin: ui.latin,
                cjk: ui.cjk,
                fallbacks: ui.fallbacks.slice(),
                size: ui.size,
                line: ui.line,
                weight: ui.weight,
                letter: ui.letter,
                features: ui.features,
              });
            }
            renderAll();
          });
        }

        $('fw-form').querySelectorAll('[data-font]').forEach((btn) => {
          btn.addEventListener('click', () => openPicker(btn.dataset.font));
        });
        $('fw-form').querySelectorAll('[data-fb]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const list = draft[selected].fallbacks;
            const i = Number(btn.dataset.i);
            const act = btn.dataset.fb;
            if (act === 'del') list.splice(i, 1);
            if (act === 'up' && i > 0) list.splice(i - 1, 0, list.splice(i, 1)[0]);
            if (act === 'down' && i < list.length - 1) list.splice(i + 1, 0, list.splice(i, 1)[0]);
            renderForm();
            renderPreview();
            renderRoles();
            markDirty();
          });
        });
        const addFallback = $('fw-add-fallback');
        if (addFallback) addFallback.addEventListener('click', () => openPicker('fallback'));

        $('fw-form').querySelectorAll('[data-key]').forEach((input) => {
          input.addEventListener('input', () => {
            const key = input.dataset.key;
            let value = input.value;
            if (key === 'size' || key === 'line' || key === 'letter') value = Number(value);
            if (key === 'weight') value = Number(value);
            draft[selected][key] = value;
            updateValueLabels();
            renderPreview();
            renderRoles();
            markDirty();
          });
        });

        $('fw-form').querySelectorAll('[data-quick-size]').forEach((btn) => {
          btn.addEventListener('click', () => {
            draft[selected].size = Number(btn.dataset.quickSize);
            renderForm();
            renderPreview();
            renderRoles();
            markDirty();
          });
        });
      }

      function updateValueLabels() {
        const d = roleData(selected);
        const size = $('fw-size-val');
        const line = $('fw-line-val');
        const letter = $('fw-letter-val');
        if (size) size.textContent = `${d.size}px`;
        if (line) line.textContent = Number(d.line).toFixed(2);
        if (letter) letter.textContent = `${d.letter}px`;
      }

      function previewStyle() {
        const e = SBFonts.effective(draft, selected);
        return [
          `font-family:${SBFonts.stack(draft, selected)}`,
          `font-size:${e.size}px`,
          `line-height:${e.line}`,
          `font-weight:${e.weight}`,
          `letter-spacing:${e.letter}px`,
          `font-feature-settings:${e.features || 'normal'}`,
        ].join(';');
      }

      function monoStyle() {
        const e = SBFonts.effective(draft, 'mono');
        return [
          `font-family:${SBFonts.stack(draft, 'mono')}`,
          `font-size:${e.size}px`,
          `line-height:${e.line}`,
          `font-weight:${e.weight}`,
          `letter-spacing:${e.letter}px`,
          `font-feature-settings:${e.features || 'normal'}`,
        ].join(';');
      }

      function renderPreview() {
        const e = SBFonts.effective(draft, selected);
        const roleName = roleLabel(selected);
        $('fw-pv-meta').textContent = `${e.size}px / ${e.line} · ${roleName}`;
        const style = escapeHtml(previewStyle());
        const mono = escapeHtml(monoStyle());

        if (selected === 'ui') {
          $('fw-pv').innerHTML = `
            <div class="fpv-window" style="${style}">
              <div class="fpv-titlebar"><span class="fpv-dot"></span><span>StickerBox</span><span class="fpv-win">— □ ✕</span></div>
              <div class="fpv-body">
                <div class="fpv-side">
                  <div class="fpv-side-title">表情库</div>
                  <div class="fpv-side-row on">全部 <b>128</b></div>
                  <div class="fpv-side-row">最近使用 <b>24</b></div>
                  <div class="fpv-side-row">收藏 <b>8</b></div>
                  <div class="fpv-side-row">未分组 <b>12</b></div>
                  <div class="fpv-tag"># 设计</div>
                  <div class="fpv-tag"># 猫猫</div>
                </div>
                <div class="fpv-content">
                  <div class="fpv-search"><span>搜索表情包…</span><kbd style="${mono}">Ctrl K</kbd></div>
                  <div class="fpv-cards">
                    <div class="fpv-card"><div class="fpv-thumb"></div><div class="fpv-card-name">海边日落.png</div><div class="fpv-card-tag"># 风景 · # 设计</div></div>
                    <div class="fpv-card"><div class="fpv-thumb"></div><div class="fpv-card-name">猫猫贴贴.gif</div><div class="fpv-card-tag"># 猫猫 · # 表情</div></div>
                    <div class="fpv-card"><div class="fpv-thumb"></div><div class="fpv-card-name">今日菜单.png</div><div class="fpv-card-tag"># 食物 · # 备忘</div></div>
                    <div class="fpv-card"><div class="fpv-thumb"></div><div class="fpv-card-name">screenshot.png</div><div class="fpv-card-tag"># 截图 · # 工作</div></div>
                  </div>
                </div>
              </div>
            </div>
          `;
        } else if (selected === 'list') {
          $('fw-pv').innerHTML = `
            <div style="${style}">
              <div class="fpv-tip">
                <div class="fpv-tip-name">海边日落.png</div>
                <div class="fpv-tip-row">1920 × 1080 · 2.4 MB</div>
                <div class="fpv-tip-row">2026-11-07 16:12 · 来自 截图</div>
                <div class="fpv-tip-tags"># 风景 · # 设计 · # 海边</div>
                <div class="fpv-caption">悬停信息（列表与卡片）</div>
              </div>
            </div>
          `;
        } else if (selected === 'panel') {
          $('fw-pv').innerHTML = `
            <div class="fpv-panel" style="${style}">
              <div class="fpv-panel-search"><span>搜索：中文 / 拼音；#标签 @分组</span><kbd style="${mono}">Esc</kbd></div>
              <div class="fpv-panel-grid">
                <div class="fpv-panel-card"><div class="fpv-panel-img"></div></div>
                <div class="fpv-panel-card"><div class="fpv-panel-img"></div></div>
                <div class="fpv-panel-card"><div class="fpv-panel-img"></div></div>
              </div>
              <div class="fpv-panel-foot"><span><kbd style="${mono}">Enter</kbd> 复制</span><span><kbd style="${mono}">Esc</kbd> 关闭</span></div>
            </div>
          `;
        } else {
          $('fw-pv').innerHTML = `
            <div class="fpv-mono" style="${style}">
              <div class="fpv-mono-block">
                <div class="fpv-mono-label">快捷键</div>
                <div class="fpv-mono-line"><kbd style="${style}">Ctrl K</kbd><kbd style="${style}">Ctrl Shift P</kbd></div>
                <div class="fpv-mono-line dim">Enter / Esc / Alt + 1…9</div>
              </div>
              <div class="fpv-mono-block">
                <div class="fpv-mono-label">路径</div>
                <div class="fpv-mono-line">C:\\Users\\13066\\StickerBox\\blobs\\ab\\cd</div>
                <div class="fpv-mono-line dim">Index: 3000 items · 12.4 MB</div>
              </div>
              <div class="fpv-mono-block">
                <div class="fpv-mono-label">尺寸</div>
                <div class="fpv-mono-line">1920 × 1080 · 120 × 96</div>
              </div>
            </div>
          `;
        }
      }

      function renderAll() {
        renderRoles();
        renderForm();
        renderPreview();
        markDirty();
      }

      function openPicker(target) {
        pickerTarget = target;
        const isFallback = target === 'fallback';
        const label = isFallback ? '回退字体' : target === 'cjk' ? '中文字体' : '西文字体';
        $('fw-picker-title').textContent = `${roleLabel(selected)} · ${label}`;
        $('fw-picker-sub').textContent = isFallback
          ? '点一次加入回退链；再点一次移除。最多 5 个。'
          : '系统字体 + 手动输入；选中后立即预览，应用后生效。';
        $('fw-picker-q').value = '';
        $('fw-manual').value = '';
        $('fw-picker-cjk-wrap').hidden = target !== 'cjk';
        $('fw-picker-cjk').checked = true;
        $('fw-picker').hidden = false;
        renderPickerList();
        setTimeout(() => $('fw-picker-q').focus(), 0);
      }

      function closePicker() {
        $('fw-picker').hidden = true;
        pickerTarget = null;
      }

      function pickerCurrent(target) {
        if (!target || target === 'fallback') return '';
        return roleData(selected)[target] || '';
      }

      function renderPickerList() {
        const q = $('fw-picker-q').value.trim().toLowerCase();
        let items = allFonts();
        if (pickerTarget === 'cjk' && $('fw-picker-cjk').checked) {
          items = items.filter((f) => f.cjk);
        }
        pickerItems = items.filter((f) => !q || f.family.toLowerCase().includes(q));
        const current = pickerCurrent(pickerTarget);
        const existing = new Set((roleData(selected).fallbacks || []).map((x) => x.toLowerCase()));
        if (!pickerItems.length) {
          $('fw-picker-list').innerHTML = '<div class="fw-picker-empty">没有匹配的字体；可以在下面手动输入字体名。</div>';
          return;
        }
        $('fw-picker-list').innerHTML = pickerItems.map((f, i) => {
          const chosen = pickerTarget === 'fallback'
            ? existing.has(f.family.toLowerCase())
            : current.toLowerCase() === f.family.toLowerCase();
          return `
            <button class="fw-picker-row ${chosen ? 'on' : ''}" type="button" data-i="${i}">
              <span class="pn">${escapeHtml(f.family)}</span>
              ${f.mono ? '<span class="pb">等宽</span>' : ''}
              ${isNerd(f.family) ? '<span class="pb">NF</span>' : ''}
              <span class="ps" style="font-family:${fontStyle(f.family)}">${escapeHtml(sampleFor(f.family, pickerTarget === 'cjk'))}</span>
            </button>
          `;
        }).join('');
        $('fw-picker-list').querySelectorAll('[data-i]').forEach((row) => {
          row.addEventListener('click', () => chooseFont(pickerItems[Number(row.dataset.i)].family));
        });
      }

      function chooseFont(family) {
        const name = String(family || '').trim();
        if (!name) return;
        if (pickerTarget === 'fallback') {
          const list = draft[selected].fallbacks;
          const i = list.findIndex((x) => x.toLowerCase() === name.toLowerCase());
          if (i >= 0) list.splice(i, 1);
          else if (list.length < SBFonts.MAX_FALLBACKS) list.push(name);
          else toast(`最多 ${SBFonts.MAX_FALLBACKS} 个回退字体`);
        } else if (pickerTarget === 'latin' || pickerTarget === 'cjk') {
          draft[selected][pickerTarget] = name;
        }
        closePicker();
        renderAll();
      }

      function useManual() {
        const value = $('fw-manual').value.trim();
        if (!value) return;
        chooseFont(value);
      }

      function setFontsCount() {
        $('fw-font-count').textContent = readingFonts
          ? '正在读取系统字体…'
          : systemFonts.length
            ? `本机 ${systemFonts.length} 个字体家族`
            : '没有读到系统字体列表；可手动输入字体名';
      }

      async function boot() {
        let s = {};
        try { s = await invoke('get_settings'); } catch (_) {}
        document.documentElement.dataset.theme = s.theme === 'light' ? 'light' : 'dark';
        saved = SBFonts.normalize(s.fonts);
        draft = clone(saved);
        renderAll();
        readingFonts = true;
        setFontsCount();
        try {
          const list = await invoke('list_system_fonts');
          systemFonts = Array.isArray(list) ? list.filter((f) => f && (f.family || typeof f === 'string')) : [];
        } catch (_) {
          systemFonts = [];
        }
        readingFonts = false;
        setFontsCount();
        renderAll();
        if (!systemFonts.length) toast('没有读到系统字体，仍可手动输入字体名');
      }

      async function applyAndClose() {
        try {
          await invoke('patch_settings', { patch: { fonts: clone(draft) } });
          await window.__TAURI__.event.emit('fonts-changed');
          saved = clone(draft);
          markDirty();
          toast('字体设置已应用');
          setTimeout(() => hideWindow(), 120);
        } catch (err) {
          toast('应用失败：' + err);
        }
      }

      function hideWindow() {
        invoke('hide_font_settings').catch(() => {});
      }

      function discardAndClose() {
        draft = clone(saved);
        renderAll();
        hideWindow();
      }

      $('fw-apply').addEventListener('click', applyAndClose);
      $('fw-cancel').addEventListener('click', discardAndClose);
      $('fw-reset').addEventListener('click', () => {
        draft = SBFonts.normalize(null);
        selected = 'ui';
        renderAll();
        toast('已恢复默认；点「应用」后生效');
      });
      $('fw-picker-close').addEventListener('click', closePicker);
      $('fw-picker-q').addEventListener('input', renderPickerList);
      $('fw-picker-cjk').addEventListener('change', renderPickerList);
      $('fw-manual-use').addEventListener('click', useManual);
      $('fw-manual').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); useManual(); }
      });
      $('fw-picker').addEventListener('click', (e) => {
        if (e.target === $('fw-picker')) closePicker();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (!$('fw-picker').hidden) closePicker();
        else discardAndClose();
      });

      boot();
    })();
  </script>
</body>
</html>
