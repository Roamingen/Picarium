<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14161a" />
  <title>StickerBox</title>
  <link rel="stylesheet" href="mobile.css" />
</head>
<body>
  <div class="app">
    <div class="topwrap" id="topwrap">
    <header class="appbar">
      <div class="brand">StickerBox<small id="libline">…</small></div>
      <button class="iconbtn" id="btn-search" title="搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="iconbtn ghost" id="btn-settings" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1z"/></svg>
      </button>
    </header>

    <div class="search" id="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="搜名字 / 拼音 / 首字母" autocomplete="off" spellcheck="false" enterkeyhint="search" />
      <button class="fbtn" id="btn-filter" title="筛选">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      </button>
    </div>

    <div class="chips" id="chips"></div>

    <div class="inbox" id="inbox" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/></svg>
      <span id="inbox-text">收到图片</span>
      <button class="undo" id="inbox-import">导入</button>
      <button class="undo undo2" id="inbox-undo">忽略</button>
    </div>
    </div>

    <section class="pins" id="pins-wrap" hidden>
      <div class="pinlbl">置顶分组 <button class="mgt" id="pins-toggle">展开</button> <button class="mgt mgt2" id="pins-manage">管理</button></div>
      <div class="pinhint" id="pins-hint" hidden>长按卡片可拖动排序</div>
      <div class="pinrow" id="pins"></div>
    </section>

    <main class="grid" id="grid" aria-live="polite"></main>

    <button class="fab" id="fab" title="导入">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <div class="selbar" id="selbar" hidden>
      <div class="selinfo"><b id="selcount">0</b> 个已选</div>
      <div class="selacts">
        <button data-sel="pin">置顶</button>
        <button data-sel="unpin">取消置顶</button>
        <button data-sel="cover">封面</button>
        <button data-sel="rename">改名</button>
        <button data-sel="delete" class="danger">删除</button>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button data-tab="gallery" class="on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg>
        <span>图库</span>
      </button>
      <button data-tab="groups">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>分组</span>
      </button>
      <button data-tab="trash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
        <span>回收站</span>
      </button>
      <button data-tab="me">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <span>我的</span>
      </button>
    </nav>

    <!-- 分组页 -->
    <section class="gview" id="groupsview" hidden>
      <header class="ghead">
        <div class="gtitle">分组<small id="gcount"></small></div>
        <button class="iconbtn" id="btn-newgroup" title="新建分组">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </header>
      <div class="search gsearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="gq" placeholder="搜索分组" autocomplete="off" spellcheck="false" />
      </div>
      <div class="folders" id="folders"></div>
    </section>

    <!-- 分组详情 -->
    <section class="gview" id="groupdetail" hidden>
      <header class="ghead">
        <button class="iconbtn back" id="btn-gback" title="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
        </button>
        <div class="gtitle" id="gd-title"></div>
        <button class="iconbtn" id="btn-gcover" title="换封面">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 3 3 3-3 5 5"/></svg>
        </button>
      </header>
      <div class="gmeta" id="gd-meta"></div>
      <div class="grid gdgrid" id="gd-grid"></div>
    </section>

    <!-- 底部弹层：长按菜单 / 换封面 / 重命名 / 新建 / 确认 -->
    <div class="selbar" id="imgsel" hidden>
      <div class="selinfo"><b id="imgn">0</b> 个已选</div>
      <div class="selacts">
        <button data-act="star">收藏</button>
        <button data-act="share">分享</button>
        <button data-act="delete" class="danger">删除</button>
      </div>
    </div>

    <div class="viewer" id="viewer" hidden>
      <div class="vtop">
        <button class="vround" id="v-close" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="vcount" id="v-count">1 / 1</div>
        <button class="vround" id="v-more" aria-label="更多">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
        </button>
      </div>
      <div class="vstage" id="v-stage">
        <div class="vglow"><img id="v-img" alt=""></div>
      </div>
      <div class="vhint" id="v-hint">左右滑动切换 · 双击放大</div>
      <div class="vinfo">
        <div class="vname" id="v-name"></div>
        <div class="vmeta" id="v-meta"></div>
        <div class="vtags" id="v-tags"></div>
      </div>
      <div class="vbar">
        <button class="vbtn primary" id="v-share">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/></svg>
          <span>分享</span>
        </button>
        <button class="vbtn" id="v-save">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v7"/><path d="m9 12 3 3 3-3"/></svg>
          <span>存相册</span>
        </button>
        <button class="vbtn" id="v-star">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
          <span>收藏</span>
        </button>
        <button class="vbtn danger" id="v-del">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
          <span>删除</span>
        </button>
      </div>
    </div>

    <div class="sheetmask" id="sheetmask" hidden>
      <div class="sheet" id="sheet">
        <div class="sheet-h" id="sheet-title"></div>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </div>

    <!-- 回收站 -->
    <section class="gview" id="trashview" hidden>
      <header class="ghead">
        <div class="gtitle">回收站<small id="tcount"></small></div>
        <button class="mgt" id="btn-purge">清空</button>
      </header>
      <div class="gmeta" id="trash-meta">删除的图片会在这里保留 7 天，期间可以恢复或彻底删除。</div>
      <div class="grid tg" id="trash-grid"></div>
    </section>

    <!-- 我的 -->
    <section class="gview" id="meview" hidden>
      <header class="ghead"><div class="gtitle">我的</div></header>
      <div class="sect">外观</div>
      <div class="mcard">
      <div class="merow"><span>主题</span><div class="seg" id="seg-theme">
        <button data-theme="auto">跟随</button><button data-theme="dark">深色</button><button data-theme="light">浅色</button>
      </div></div>
      <div class="merow"><span>回收站保留</span><div class="seg" id="seg-trash">
        <button data-days="7">7 天</button><button data-days="30">30 天</button><button data-days="90">90 天</button>
      </div></div>
      <div class="merow"><span>网格列数</span><div class="seg" id="seg-cols">
        <button data-cols="3">3</button><button data-cols="4">4</button><button data-cols="5">5</button>
      </div></div>
      </div>
      <div class="sect">导入</div>
      <div class="mcard">
      <div class="merow tap" id="me-gallery"><span>从手机相册导入</span><i>最多 100 张</i></div>
      <div class="merow tap" id="me-inbox"><span>分享收件箱</span><i id="me-inbox-n">0 个待整理</i></div>
      </div>
      <div class="sect">关于</div>
      <div class="mcard">
      <div class="merow"><span>版本</span><i>预览版</i></div>
      <div class="merow"><span>存储位置</span><i class="ell" id="me-home">…</i></div>
      </div>
    </section>

    <div class="toast" id="toast" hidden></div>
  </div>
  <script src="mobile.js" defer></script>
</body>
</html>
