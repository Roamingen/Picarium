<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Picarium</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="panel-body">
  <div class="panel">
    <div class="panel-search-row">
      <svg class="panel-glass" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2" />
        <line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <input id="q" class="panel-search" placeholder="搜索表情，按名称 / 拼音过滤" autocomplete="off" spellcheck="false" />
      <span id="count" class="panel-count"></span>
    </div>

    <div id="grid" class="panel-grid"></div>
    <div id="hint" class="panel-empty">没有匹配的表情</div>
  <div id="tip" class="tip"></div>

    <div class="panel-foot">
      <span id="navhint"></span>
      <span><kbd>Enter</kbd> 复制</span>
      <span><kbd>Esc</kbd> 关闭</span>
    </div>
  </div>

  <script src="font-config.js"></script>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('stickerbox-theme') || 'dark';
    const { invoke, convertFileSrc } = window.__TAURI__.core;
    const $ = (id) => document.getElementById(id);
    const grid = $('grid');
    const input = $('q');
    const hint = $('hint');
    const tipEl = $('tip');
    const count = $('count');
    const navhint = $('navhint');
    let items = [];
    let cursor = 0;
    let panelSort = 'recent';
    let recentLimit = 60;
    let hoverDelay = 350;
    let cursorSpeed = 2.4;
    let cursorColors = ['#6ea8fe', '#f5b301'];
    let animTimer = null;
    let panelKeys = {
      up: ['ArrowUp', 'Ctrl+K'],
      down: ['ArrowDown', 'Ctrl+J'],
      left: ['ArrowLeft', 'Ctrl+H'],
      right: ['ArrowRight', 'Ctrl+L'],
      info: ['Ctrl+Shift+K'],
    };
    let tagNames = [];
    let groupNames = [];

    const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const PANEL_SLOTS = ['up', 'down', 'left', 'right', 'info'];
    const VIM_KEY = { up: 'Ctrl+K', down: 'Ctrl+J', left: 'Ctrl+H', right: 'Ctrl+L' };
    const KEY_SYM = { ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', Space: 'Space' };

    function keySym(k) {
      if (KEY_SYM[k]) return KEY_SYM[k];
      return String(k).length === 1 ? String(k).toUpperCase() : String(k);
    }

    function navLabel(combo) {
      return String(combo).split('+').map(keySym).join('+');
    }

    function slotKeys(slot) {
      return Array.isArray(panelKeys[slot]) ? panelKeys[slot] : [];
    }

    function paintFooter() {
      // 底栏只显示每行第一个键，避免多个绑定时挤成一片
      const keys = ['up', 'down', 'left', 'right']
        .map((d) => `<kbd>${keySym(slotKeys(d)[0] || '—')}</kbd>`)
        .join(' ');
      navhint.innerHTML = `${keys} 选择`;
    }

    function comboOf(e) {
      return (e.ctrlKey ? 'Ctrl+' : '') + (e.altKey ? 'Alt+' : '') + (e.shiftKey ? 'Shift+' : '')
        + (e.key.length === 1 ? e.key.toUpperCase() : e.key);
    }

    function dirFor(e) {
      const combo = comboOf(e);
      for (const d of ['up', 'down', 'left', 'right']) {
        if (slotKeys(d).includes(combo)) return d;
      }
      return null;
    }

    function columns() {
      const cols = getComputedStyle(grid).gridTemplateColumns;
      const n = cols.split(' ').filter(Boolean).length;
      return Math.max(1, n);
    }

    function thumbUrl(sha) {
      try { return convertFileSrc(sha, 'thumb'); } catch (_) { return `http://thumb.localhost/${sha}`; }
    }

    // 与主界面键盘光标同一套：颜色和速度来自设置，规则写在伪元素自己身上才会转
    function applyCursorRing() {
      const cols = cursorColors.length ? cursorColors : ['#6ea8fe', '#f5b301'];
      // 末尾补回第一个颜色，让 0° 和 360° 接得上，否则会出现一条硬接缝
      const stops = cols.length === 1 ? [cols[0], cols[0]] : [...cols, cols[0]];
      let el = document.getElementById('cursor-style');
      if (!el) {
        el = document.createElement('style');
        el.id = 'cursor-style';
        document.head.appendChild(el);
      }
      el.textContent = `
.panel-card.active::before {
  background: conic-gradient(from var(--cursor-angle), ${stops.join(', ')});
  animation: cursor-spin ${cursorSpeed}s linear infinite;
  animation-delay: calc(-1 * var(--cursor-phase, 0s));
}`;
    }

    function render() {
      clearTimeout(animTimer);
      animTimer = null;
      grid.innerHTML = '';
      if (!items.length) {
        hint.style.display = 'block';
        count.textContent = '';
        return;
      }
      hint.style.display = 'none';
      count.textContent = items.length + ' 个结果';

      const frag = document.createDocumentFragment();
      items.forEach((a, i) => {
        const el = document.createElement('button');
        el.className = 'panel-card' + (i === cursor ? ' active' : '');
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = thumbUrl(a.sha);
        img.onerror = () => { img.onerror = null; img.src = convertFileSrc(a.path); };
        el.appendChild(img);
        el.addEventListener('mouseenter', (e) => {
          cursor = i;
          paint();
          showTip(a, e);
        });
        el.addEventListener('mousemove', moveTip);
        el.addEventListener('mouseleave', () => {
          tipEl.classList.remove('show');
        });
        el.addEventListener('click', () => { cursor = i; copy(); });
        frag.appendChild(el);
      });
      grid.appendChild(frag);
      paint();
    }

    // 与主界面悬浮信息保持同一条款：名称 / 尺寸体积 / 格式与导入时间 / 来源 / 分组 / 标签
    const APP_NAMES = {
      'weixin.exe': '微信', 'wechat.exe': '微信', 'qq.exe': 'QQ', 'qqnt.exe': 'QQ',
      'telegram.exe': 'Telegram', 'discord.exe': 'Discord', 'snipaste.exe': 'Snipaste',
      'explorer.exe': '资源管理器', 'chrome.exe': 'Chrome', 'msedge.exe': 'Edge', 'firefox.exe': 'Firefox',
    };

    function fmtSize(bytes) {
      if (bytes >= 1048576) return (bytes / 1048576).toFixed(2) + ' MB';
      return Math.max(1, Math.round(bytes / 1024)) + ' KB';
    }

    function fmtDate(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function friendlySource(a) {
      if (a.source === 'folder') return '本地导入';
      if (a.source === 'clipboard') {
        const raw = (a.source_ref || '').split(/[\/]/).pop() || '剪贴板';
        return `剪贴板 · ${APP_NAMES[raw.toLowerCase()] || raw}`;
      }
      return a.source || '未知';
    }

    function showTip(a, e) {
      const tags = a.tags && a.tags.length ? a.tags : ['无标签'];
      const groups = a.groups && a.groups.length ? a.groups.join(' · ') : '未分组';
      tipEl.innerHTML = `
        <div class="tip-body">
          <div class="tip-copy">
            <div class="tip-name">${esc(a.name)}</div>
            <div class="tip-meta">${esc(a.ext.toUpperCase())} · ${a.animated ? '动图' : '静态'} · ${a.width} × ${a.height} · ${fmtSize(a.bytes)}</div>
            <div class="tip-facts">
              <span class="tip-fact">来源 <b>${esc(friendlySource(a))}</b></span>
              <span class="tip-fact">分组 <b>${esc(groups)}</b></span>
            </div>
            <div class="tip-tags">${tags.map((t) => `<span class="tip-tag">${esc(t)}</span>`).join('')}</div>
          </div>
        </div>
        <div class="tip-foot">
          <span class="tip-keys"><kbd>Enter</kbd> 复制</span>
          <span class="tip-keys"><kbd>Esc</kbd> 关闭</span>
        </div>`;
      tipEl.classList.add('show');
      moveTip(e);
    }

    function moveTip(e) {
      if (!tipEl.classList.contains('show')) return;
      const pad = 14;
      const r = tipEl.getBoundingClientRect();
      let x = e.clientX + pad, y = e.clientY + pad;
      if (x + r.width > window.innerWidth - 6) x = e.clientX - r.width - pad;
      if (y + r.height > window.innerHeight - 6) y = e.clientY - r.height - pad;
      tipEl.style.transform = `translate(${x}px, ${y}px)`;
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function paint() {
      clearTimeout(animTimer);
      animTimer = null;
      [...grid.children].forEach((el, i) => {
        const on = i === cursor;
        el.classList.toggle('active', on);
        // 光标所在的卡片始终播放；移走才退回静态缩略图
        if (el.dataset.anim && !on) {
          const img = el.querySelector('img');
          const a = items[i];
          if (img && a) img.src = thumbUrl(a.sha);
          delete el.dataset.anim;
        }
      });
      const active = grid.children[cursor];
      if (active) {
        active.scrollIntoView({ block: 'nearest' });
        const a = items[cursor];
        // 预览跟着光标走：打开面板/方向键移动/悬停都从当前光标开始播
        if (a && a.animated && hoverDelay > 0 && !active.dataset.anim) {
          animTimer = setTimeout(() => {
            if (grid.children[cursor] !== active) return; // 等待期间光标已经移走
            const img = active.querySelector('img');
            if (!img) return;
            img.src = convertFileSrc(a.path);
            active.dataset.anim = '1';
          }, hoverDelay);
        }
      }
      const phase = (performance.now() / 1000) % Math.max(0.4, cursorSpeed);
      document.documentElement.style.setProperty('--cursor-phase', phase + 's');
    }

    function toggleInfo() {
      if (tipEl.classList.contains('show')) {
        tipEl.classList.remove('show');
        return;
      }
      const a = items[cursor];
      const el = grid.children[cursor];
      if (!a || !el) return;
      const r = el.getBoundingClientRect();
      showTip(a, { clientX: r.right, clientY: r.top });
    }

    function move(dx, dy) {
      if (!items.length) return;
      tipEl.classList.remove('show');
      let next = cursor + dx + dy * columns();
      if (next < 0) next = 0;
      if (next >= items.length) next = items.length - 1;
      if (next === cursor) return; // 到边界后继续按同一方向，不要把等待中的动图计时器重置
      cursor = next;
      paint();
    }

    async function copy() {
      const a = items[cursor];
      if (!a) return;
      try {
        if (a.animated) {
          await invoke('copy_asset_file', { sha: a.sha });
        } else {
          await invoke('copy_asset', { sha: a.sha });
        }
        await invoke('hide_panel');
      } catch (e) {
        hint.textContent = '复制失败：' + e;
        hint.style.display = 'block';
      }
    }

    // 面板搜索语法：#标签、@分组，都按前缀匹配；前缀没命中就退回普通文字搜索。
    // 前缀命中多个（#浏 → 浏览 / 浏览器）算 OR；多个 token 之间 AND；- 前缀表示排除。
    function parseQuery(raw) {
      const out = { q: '', extra: [], tagGroups: [], notTags: [], groupGroups: [], notGroups: [] };
      const free = [];
      for (const w of String(raw).trim().split(/\s+/).filter(Boolean)) {
        let neg = false;
        let s = w;
        if (s.startsWith('-') && s.length > 1) {
          neg = true;
          s = s.slice(1);
        }
        let kind = '';
        if (s.startsWith('#')) {
          kind = 'tag';
          s = s.slice(1);
        } else if (s.startsWith('@')) {
          kind = 'group';
          s = s.slice(1);
        }
        if (!kind) {
          free.push(w);
          continue;
        }
        if (!s) continue; // 刚敲下 # / @，先不筛选
        const pool = kind === 'tag' ? tagNames : groupNames;
        const low = s.toLowerCase();
        const hits = pool.filter((n) => n.toLowerCase().startsWith(low));
        if (!hits.length) {
          if (neg) continue; // 排除项没命中，等于什么都没排
          free.push(w); // 前缀没命中 → 当普通文字搜
          continue;
        }
        if (neg) {
          const bucket = kind === 'tag' ? out.notTags : out.notGroups;
          for (const h of hits) if (!bucket.includes(h)) bucket.push(h);
        } else {
          (kind === 'tag' ? out.tagGroups : out.groupGroups).push(hits);
        }
      }
      out.q = free[0] || '';
      out.extra = free.slice(1);
      return out;
    }

    async function loadFacets() {
      try {
        const [ts, gs] = await Promise.all([invoke('tag_stats'), invoke('group_stats')]);
        tagNames = (ts || []).map((t) => t.name).filter(Boolean);
        groupNames = ((gs && gs.groups) || []).map((g) => g.name).filter(Boolean);
      } catch (_) {}
    }

    async function search(raw) {
      const parsed = parseQuery(raw);
      const filters = {};
      if (parsed.tagGroups.length) filters.tagGroups = parsed.tagGroups;
      if (parsed.notTags.length) filters.notTags = parsed.notTags;
      if (parsed.groupGroups.length) filters.groupGroups = parsed.groupGroups;
      if (parsed.notGroups.length) filters.notGroups = parsed.notGroups;
      const args = { q: parsed.q, limit: recentLimit, sort: panelSort };
      if (Object.keys(filters).length) args.filters = JSON.stringify(filters);
      items = await invoke('list_assets', args);
      // q 只吃第一个自由词，多出来的词在这里做 AND，名字/拼音/首字母都认
      if (parsed.extra.length) {
        const words = parsed.extra.map((w) => w.toLowerCase());
        items = items.filter((a) => words.every((w) => {
          const name = String(a.name || '').toLowerCase();
          return name.includes(w) || String(a.py || '').includes(w) || String(a.py_abbr || '').includes(w);
        }));
      }
      cursor = 0;
      render();
    }

    let timer = null;
    input.addEventListener('input', (e) => {
      clearTimeout(timer);
      timer = setTimeout(() => search(e.target.value), 60);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); copy(); return; }
      if (e.key === 'Escape') { e.preventDefault(); invoke('hide_panel'); return; }
      if (slotKeys('info').includes(comboOf(e))) {
        e.preventDefault();
        toggleInfo();
        return;
      }
      const dir = dirFor(e);
      if (dir) {
        e.preventDefault();
        const [dx, dy] = DIRS[dir];
        move(dx, dy);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') invoke('hide_panel');
    });

    // 面板里也不弹浏览器原生右键菜单
    document.addEventListener('contextmenu', (e) => e.preventDefault(), true);
    document.addEventListener(
      'mousedown',
      (e) => {
        if (e.button === 1) e.preventDefault();
      },
      true
    );

    function applyPanelFonts(raw) {
      const fonts = SBFonts.normalize(raw);
      const root = document.documentElement;
      for (const id of SBFonts.ROLE_IDS) {
        const e = SBFonts.effective(fonts, id);
        root.style.setProperty(`--font-${id}`, SBFonts.stack(fonts, id));
        root.style.setProperty(`--font-${id}-size`, `${e.size}px`);
        root.style.setProperty(`--font-${id}-line`, String(e.line));
        root.style.setProperty(`--font-${id}-weight`, String(e.weight));
        root.style.setProperty(`--font-${id}-letter`, `${e.letter}px`);
        root.style.setProperty(`--font-${id}-features`, e.features || 'normal');
      }
    }

    async function applySettings() {
      try {
        const st = await invoke('get_settings');
        applyPanelFonts(st.fonts);
        if (st.panelSort) panelSort = st.panelSort;
        if (typeof st.recentLimit === 'number') recentLimit = st.recentLimit;
        if (typeof st.hoverDelay === 'number') hoverDelay = st.hoverDelay;
        if (typeof st.cursorSpeed === 'number' && Number.isFinite(st.cursorSpeed)) cursorSpeed = st.cursorSpeed;
        if (Array.isArray(st.cursorColors) && st.cursorColors.length) cursorColors = st.cursorColors.slice(0, 8);
        if (st.panelKeys && typeof st.panelKeys === 'object') {
          for (const slot of PANEL_SLOTS) {
            if (!Array.isArray(st.panelKeys[slot])) continue;
            const keys = st.panelKeys[slot].filter((k) => typeof k === 'string' && k);
            if (keys.length) panelKeys[slot] = keys;
          }
        } else {
          // 老设置：每方向一个键 + Ctrl HJKL 开关
          const vimOk = st.panelVim !== false;
          for (const slot of ['up', 'down', 'left', 'right']) {
            const legacy = st.panelNav && typeof st.panelNav[slot] === 'string' ? st.panelNav[slot] : slotKeys(slot)[0];
            const alt = vimOk ? VIM_KEY[slot] : '';
            panelKeys[slot] = alt && alt !== legacy ? [legacy, alt] : [legacy];
          }
          if (typeof st.panelInfoKey === 'string' && st.panelInfoKey) panelKeys.info = [st.panelInfoKey];
        }
        if (st.theme) document.documentElement.dataset.theme = st.theme;
      } catch (_) {}
      applyCursorRing();
      paintFooter();
    }

    window.__TAURI__.event.listen('fonts-changed', async () => {
      await applySettings();
    });

    window.__TAURI__.event.listen('panel-open', async () => {
      input.value = '';
      await applySettings();
      await loadFacets();
      await search('');
      input.focus();
      input.select();
    });

    (async () => {
      await applySettings();
      await loadFacets();
      input.focus();
      search('');
    })();
  </script>
</body>
</html>
