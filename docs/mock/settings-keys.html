<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>StickerBox 设置 · 快贴面板按键</title>
<style>
  :root{
    --bg:#14161a; --bg-2:#1b1e24; --surface:#0f1115; --surface-2:#232833;
    --line:#2a2f38; --line-2:#333a47; --hover:#2a3140; --active:#26354d;
    --fg:#e8eaed; --dim:#8b93a1; --dim-2:#5d6573; --accent:#6ea8fe; --accent-fg:#dce7ff;
    --danger:#e06c75; --kbd-bg:#222833; --kbd-border:#333b48; --kbd-fg:#c8ced8;
    --hairline:rgba(255,255,255,.04); --radius:8px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:#0b0d10; color:var(--fg); font:13px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    padding:32px 20px 48px; display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  .head{width:660px; color:var(--dim); font-size:12px}
  .head b{color:var(--fg); font-size:14px; display:block; margin-bottom:3px}
  .card{width:660px; background:var(--bg); border:1px solid var(--line-2); border-radius:12px; overflow:hidden}
  .card > h3{
    margin:0; padding:14px 18px 12px; font-size:13px; font-weight:600; color:var(--fg);
    border-bottom:1px solid var(--hairline); letter-spacing:.2px;
  }
  .card > h3 span{font-weight:400; color:var(--dim); font-size:11.5px; margin-left:8px}
  .row{display:flex; align-items:center; gap:14px; padding:11px 18px; border-bottom:1px solid var(--hairline)}
  .row:last-child{border-bottom:0}
  .row .label{width:96px; flex:none; color:var(--fg)}
  .row .desc{flex:1; min-width:0; color:var(--dim); font-size:11.5px}
  .keybtn{
    flex:none; min-width:118px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:6px 12px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:var(--radius);
    color:var(--fg); font:12px/1.4 inherit; cursor:pointer; transition:border-color .12s, background .12s;
  }
  .keybtn:hover{background:var(--hover)}
  .keybtn.capture{border-color:var(--accent); color:var(--accent-fg); background:var(--active)}
  .keybtn.dup{border-color:var(--danger)}
  .keybtn kbd{font-size:12px}
  .warn{padding:0 18px 12px; margin:-4px 0 0; color:var(--danger); font-size:11.5px; display:none}
  .warn.show{display:block}
  kbd{display:inline-block; padding:1px 6px; border:1px solid var(--kbd-border); border-bottom-width:2px; border-radius:4px; background:var(--kbd-bg); color:var(--kbd-fg); font:11px/1.6 inherit}
  .switch{position:relative; width:36px; height:20px; flex:none}
  .switch input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:2}
  .switch i{position:absolute; inset:0; border-radius:999px; background:#2b313c; transition:background .15s}
  .switch i::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#8b93a1; transition:transform .15s, background .15s}
  .switch input:checked + i{background:var(--active)}
  .switch input:checked + i::after{transform:translateX(16px); background:var(--accent)}
  .preview{
    width:660px; background:var(--surface); border:1px dashed var(--line-2); border-radius:12px; padding:12px 16px;
    display:flex; align-items:center; gap:14px; color:var(--dim); font-size:11.5px;
  }
  .preview b{color:var(--fg); font-size:12px; font-weight:500}
  .preview .sp{flex:1}
  .note{width:660px; color:var(--dim-2); font-size:11.5px; margin-top:-4px}
  .note code{color:var(--dim); background:var(--surface-2); padding:1px 5px; border-radius:4px}
</style>
</head>
<body>
  <div class="head">
    <b>设置 › 快贴面板 › 导航键（预览）</b>
    四个方向各绑一个键，默认就是方向键；Ctrl+HJKL 是额外的一组，默认开启。面板底栏提示只说当前真正生效的键。
  </div>

  <div class="card">
    <h3>导航键 <span>点一下按钮，然后按下新键（Esc 取消）</span></h3>
    <div class="row"><span class="label">上</span><button class="keybtn" data-dir="up"><kbd>↑</kbd><span>ArrowUp</span></button><span class="desc">上一行 / 上一张</span></div>
    <div class="row"><span class="label">下</span><button class="keybtn" data-dir="down"><kbd>↓</kbd><span>ArrowDown</span></button><span class="desc">下一行 / 下一张</span></div>
    <div class="row"><span class="label">左</span><button class="keybtn" data-dir="left"><kbd>←</kbd><span>ArrowLeft</span></button><span class="desc">向左一格，到头停住</span></div>
    <div class="row"><span class="label">右</span><button class="keybtn" data-dir="right"><kbd>→</kbd><span>ArrowRight</span></button><span class="desc">向右一格，到头停住</span></div>
    <div class="row"><span class="label">查看信息</span><button class="keybtn" data-dir="info"><kbd>Ctrl+Shift+K</kbd><span>Ctrl+Shift+K</span></button><span class="desc">等效于鼠标停在该卡片上，再按收起</span></div>
    <p class="warn" id="warn">两个功能绑到了同一个键，面板会分不清。</p>
    <div class="row">
      <span class="label">Ctrl+HJKL</span>
      <span class="desc">额外的 vim 风格导航，默认开；底栏不显示它，只是能用</span>
      <label class="switch"><input type="checkbox" id="vim" checked><i></i></label>
    </div>
  </div>

  <div class="preview">
    <b>面板底栏预览</b>
    <span class="sp"></span>
    <span id="hint"></span>
  </div>

  <div class="note">
    冲突在保存时才拦（<code>up == down</code> 之类），编辑过程中只标红不弹窗；按键支持 <code>Ctrl</code>/<code>Alt</code> 组合，单字符也收。
  </div>

<script>
const KEY_LABEL = { ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', ' ': 'Space' };
const state = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', info: 'Ctrl+Shift+K', vim: true };
let capturing = null;

const btns = [...document.querySelectorAll('.keybtn')];
const warn = document.getElementById('warn');
const hint = document.getElementById('hint');
const vimBox = document.getElementById('vim');

const short = (k) => KEY_LABEL[k] || (k.length === 1 ? k.toUpperCase() : k);
const kbd = (k) => `<kbd>${short(k)}</kbd>`;

function paint() {
  for (const b of btns) {
    const dir = b.dataset.dir;
    const k = state[dir];
    b.classList.toggle('capture', capturing === dir);
    b.innerHTML = capturing === dir
      ? '<span>按下新的键…</span>'
      : `${kbd(k)}<span style="color:var(--dim)">${k}</span>`;
  }
  const vals = ['up', 'down', 'left', 'right', 'info'].map((d) => state[d]);
  const dup = vals.length !== new Set(vals).size;
  warn.classList.toggle('show', dup);
  btns.forEach((b) => b.classList.toggle('dup', dup));

  const parts = [`${kbd(state.up)}${kbd(state.down)}${kbd(state.left)}${kbd(state.right)} 选择`];
  parts.push('<kbd>Enter</kbd> 复制', '<kbd>Esc</kbd> 关闭');
  hint.innerHTML = parts.join(' &nbsp; ');
}

btns.forEach((b) => b.addEventListener('click', () => { capturing = b.dataset.dir; paint(); }));
vimBox.addEventListener('change', () => { state.vim = vimBox.checked; paint(); });

window.addEventListener('keydown', (e) => {
  if (!capturing) return;
  e.preventDefault();
  if (e.key === 'Escape') { capturing = null; paint(); return; }
  if (e.key === 'Tab' || e.key === 'Enter') return;
  const combo = (e.ctrlKey ? 'Ctrl+' : '') + (e.altKey ? 'Alt+' : '') + (e.shiftKey ? 'Shift+' : '') + (e.key.length === 1 ? e.key.toUpperCase() : e.key);
  state[capturing] = combo;
  capturing = null;
  paint();
});

paint();
</script>
</body>
</html>
