<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>快贴面板按键设置（预览）</title>
<style>
  :root{
    --bg:#17191f; --surface:#1c1f26; --surface-2:#22262f; --hover:#262b35; --active:#2b3140;
    --fg:#e6e8ee; --dim:#9aa3b2; --dim-2:#6d7789; --line:#2a2f3a; --line-2:#333a47; --line-3:#3c4453;
    --accent:#4c9aff; --accent-fg:#0f1522; --danger:#ff6b6b; --kbd-bg:#242a35; --kbd-border:#3a4252; --kbd-fg:#cfd6e4;
  }
  *{box-sizing:border-box}
  body{margin:0; padding:28px 24px 48px; background:var(--bg); color:var(--fg); font:13px/1.65 "Segoe UI", "Microsoft YaHei UI", sans-serif; display:flex; flex-direction:column; align-items:center; gap:18px}
  .head{width:660px; color:var(--dim); font-size:12.5px}
  .head b{display:block; color:var(--fg); font-size:15px; font-weight:600; margin-bottom:6px}
  .card{width:660px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:6px 18px 14px}
  .sec{display:flex; align-items:center; gap:8px; padding:14px 0 6px; color:var(--dim); font-size:11.5px; letter-spacing:.02em}
  .sec::after{content:""; flex:1; height:1px; background:var(--line)}
  .row{display:flex; align-items:center; gap:10px; padding:7px 0}
  .label{flex:0 0 74px; color:var(--dim); font-size:12.5px}
  .chips{display:flex; align-items:center; gap:6px; flex-wrap:wrap; flex:1}
  .chip{display:inline-flex; align-items:center; gap:6px; padding:4px 5px 4px 8px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line-3); font-size:12px; cursor:pointer}
  .chip:hover{background:var(--hover)}
  .chip .k{color:var(--dim); font-size:11px}
  .chip .x{display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border-radius:4px; color:var(--dim-2); font-size:10px}
  .chip .x:hover{background:var(--danger); color:#fff}
  .chip.dup{border-color:var(--danger)}
  .chip.capturing,.add.capturing{border-color:var(--accent); background:var(--active); color:var(--accent-fg)}
  .add{padding:4px 9px; border-radius:8px; font:inherit; font-size:12px; cursor:pointer; background:transparent; border:1px dashed var(--line-3); color:var(--dim)}
  .add:hover{color:var(--fg); border-color:var(--dim)}
  kbd{display:inline-block; padding:1px 6px; border:1px solid var(--kbd-border); border-bottom-width:2px; border-radius:4px; background:var(--kbd-bg); color:var(--kbd-fg); font:11px/1.6 inherit}
  .hintline{padding:10px 0 0; color:var(--dim-2); font-size:11.5px}
  .warn{color:var(--danger); font-size:11.5px; padding-top:6px; display:none}
  .warn.show{display:block}
  .preview{width:660px; background:var(--surface); border:1px dashed var(--line-2); border-radius:12px; padding:12px 16px; display:flex; align-items:center; gap:14px; color:var(--dim); font-size:11.5px}
  .preview b{color:var(--fg); font-size:12px; font-weight:500}
  .preview .sp{flex:1}
  .note{width:660px; color:var(--dim-2); font-size:11.5px; margin-top:-4px}
  .note code{color:var(--dim); background:var(--surface-2); padding:1px 5px; border-radius:4px}
</style>
</head>
<body>
  <div class="head">
    <b>设置 › 按键 › 快贴面板按键设置（预览）</b>
    四个方向各是一行，每行可以挂多个键；第一个键会显示在面板底栏。Ctrl+HJKL 只是默认的第二条绑定，删掉就没有了。
  </div>

  <div class="card">
    <div class="sec">快贴面板按键设置</div>
    <div id="rows"></div>
    <div class="hintline">点「+ 添加」再按新键会把键加到这一行；点键上的 ✕ 移除。单字符（比如 <kbd>k</kbd>）会和搜索输入冲突，请用方向键或加 Ctrl/Alt。</div>
    <div class="warn" id="warn"></div>
  </div>

  <div class="preview">
    <b>面板底栏预览</b>
    <span class="sp"></span>
    <span id="hint"></span>
  </div>

  <div class="note">
    不同配列可以各配各的：<code>向上 = ↑ / Ctrl+W / Ctrl+Alt+U</code>，或者把方向键整个换掉只留 <code>Ctrl+HJKL</code>；同一行里先匹配到的键生效。
  </div>

<script>
const SLOTS = [
  ['up', '向上', ['ArrowUp', 'Ctrl+K']],
  ['down', '向下', ['ArrowDown', 'Ctrl+J']],
  ['left', '向左', ['ArrowLeft', 'Ctrl+H']],
  ['right', '向右', ['ArrowRight', 'Ctrl+L']],
  ['info', '查看信息', ['Ctrl+Shift+K']],
];
const SYM = { ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', Space: 'Space' };
const label = (c) => c.split('+').map((k) => SYM[k] || (k.length === 1 ? k.toUpperCase() : k)).join('+');
const state = Object.fromEntries(SLOTS.map(([slot, , keys]) => [slot, keys.slice()]));

let capturing = null; // {slot, idx|null}
const rows = document.getElementById('rows');
const warn = document.getElementById('warn');
const hint = document.getElementById('hint');

function render() {
  rows.innerHTML = SLOTS.map(([slot, name]) => `
    <div class="row" data-slot="${slot}">
      <span class="label">${name}</span>
      <span class="chips">
        ${state[slot].map((c, i) => `
          <span class="chip" data-slot="${slot}" data-idx="${i}" title="点一下换成新键">
            <kbd>${label(c)}</kbd>${label(c) === c ? '' : `<span class="k">${c}</span>`}
            <span class="x" data-del="${slot}:${i}">✕</span>
          </span>`).join('')}
        <button class="add" data-add="${slot}" type="button">+ 添加</button>
      </span>
    </div>`).join('');
  const used = {};
  for (const [slot] of SLOTS) for (const c of state[slot]) used[c] = (used[c] || 0) + 1;
  const dup = Object.values(used).some((n) => n > 1);
  const empty = SLOTS.filter(([s]) => !state[s].length).map(([, n]) => n);
  for (const el of rows.querySelectorAll('.chip')) if (used[state[el.dataset.slot][el.dataset.idx]] > 1) el.classList.add('dup');
  const msgs = [];
  if (dup) msgs.push('两个功能绑到了同一个键，面板会分不清');
  if (empty.length) msgs.push(`${empty.map((n) => '「' + n + '」').join('、')}还没有绑定`);
  warn.textContent = msgs.join('；');
  warn.classList.toggle('show', msgs.length > 0);
  hint.innerHTML = ['up', 'down', 'left', 'right'].map((s) => `<kbd>${label(state[s][0] || '—')}</kbd>`).join(' ') + ' 选择 <kbd>Enter</kbd> 复制 <kbd>Esc</kbd> 关闭';
  if (capturing) {
    const el = rows.querySelector(`.chip[data-slot="${capturing.slot}"][data-idx="${capturing.idx}"]`)
      || rows.querySelector(`.add[data-add="${capturing.slot}"]`);
    if (el) { el.classList.add('capturing'); if (el.classList.contains('chip')) el.querySelector('kbd').textContent = '按下新键…'; else el.textContent = '按下新键…'; }
  }
}

rows.addEventListener('click', (e) => {
  const del = e.target.closest('[data-del]');
  if (del) {
    const [slot, i] = del.dataset.del.split(':');
    if (state[slot].length <= 1) { warn.textContent = '每个方向至少留一个键'; warn.classList.add('show'); return; }
    state[slot].splice(Number(i), 1);
    capturing = null;
    render();
    return;
  }
  const add = e.target.closest('[data-add]');
  if (add) { capturing = { slot: add.dataset.add, idx: null }; render(); return; }
  const chip = e.target.closest('.chip');
  if (chip) { capturing = { slot: chip.dataset.slot, idx: Number(chip.dataset.idx) }; render(); }
});

document.addEventListener('keydown', (e) => {
  if (!capturing) return;
  e.preventDefault();
  if (e.key === 'Escape') { capturing = null; render(); return; }
  if (['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) return;
  if (e.key.length === 1 && !e.ctrlKey && !e.altKey) { warn.textContent = '单字符会和搜索输入冲突，请用方向键或加 Ctrl/Alt'; warn.classList.add('show'); capturing = null; render(); return; }
  const combo = (e.ctrlKey ? 'Ctrl+' : '') + (e.altKey ? 'Alt+' : '') + (e.shiftKey ? 'Shift+' : '') + (e.key.length === 1 ? e.key.toUpperCase() : e.key);
  const clash = SLOTS.some(([s]) => state[s].some((c, i) => c === combo && !(s === capturing.slot && i === capturing.idx)));
  if (clash) { warn.textContent = `「${label(combo)}」已经绑给别的键了`; warn.classList.add('show'); capturing = null; render(); return; }
  if (capturing.idx == null) state[capturing.slot].push(combo);
  else state[capturing.slot][capturing.idx] = combo;
  capturing = null;
  render();
}, true);

render();
</script>
</body>
</html>
