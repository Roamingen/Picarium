<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>StickerBox 快贴面板 v2 · 预览</title>
<style>
  :root{
    --bg:#14161a; --bg-2:#1b1e24; --surface:#0f1115; --surface-2:#232833; --surface-3:#1c212a;
    --line:#2a2f38; --line-2:#333a47; --line-3:#303642; --hover:#2a3140; --active:#26354d;
    --active-2:#1b2230; --fg:#e8eaed; --dim:#8b93a1; --dim-2:#5d6573; --accent:#6ea8fe;
    --accent-fg:#dce7ff; --chip:#27303f; --kbd-bg:#222833; --kbd-border:#333b48; --kbd-fg:#c8ced8;
    --hairline:rgba(255,255,255,.04); --shadow:rgba(0,0,0,.55); --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#0b0d10; color:var(--fg); font:13px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:16px; padding:28px 20px;
  }
  .demo-head{width:820px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; color:var(--dim)}
  .demo-head b{color:var(--fg); font-size:14px}
  .demo-head .sp{flex:1}
  .seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .seg button{background:var(--surface-2); color:var(--dim); border:0; padding:5px 11px; font-size:12px; cursor:pointer}
  .seg button.on{background:var(--active); color:var(--accent-fg)}

  /* ---------- 面板本体 ---------- */
  .panel{
    width:820px; height:560px; display:flex; flex-direction:column; background:var(--bg);
    border:1px solid var(--line-3); border-radius:12px; overflow:hidden; box-shadow:0 24px 60px var(--shadow);
  }
  .search-row{display:flex; align-items:center; gap:10px; padding:13px 16px 11px; border-bottom:1px solid var(--hairline); position:relative}
  .search-row svg{width:18px; height:18px; flex:none; color:var(--dim)}
  .search{
    flex:1; min-width:0; border:0; background:transparent; color:var(--fg); font:15px/1.4 inherit;
    padding:3px 0; outline:none; caret-color:var(--accent);
  }
  .search::placeholder{color:var(--dim-2)}
  .count{flex:none; font-size:11px; color:var(--dim)}

  /* 已识别的筛选 token */
  .tokens{display:none; gap:6px; flex-wrap:wrap; padding:0 16px 10px; border-bottom:1px solid var(--hairline)}
  .tokens.show{display:flex}
  .token{display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border-radius:999px; background:var(--chip); font-size:11.5px; color:var(--fg)}
  .token i{font-style:normal; color:var(--dim)}
  .token .hit{color:var(--dim); font-size:11px; padding-left:2px}
  .token b{font-weight:500}
  .token.unknown{background:transparent; border:1px dashed var(--line-2); color:var(--dim)}

  /* #/@ 补全 */
  .suggest{
    position:absolute; left:44px; top:calc(100% - 4px); width:260px; z-index:20; display:none;
    background:var(--surface-2); border:1px solid var(--line-2); border-radius:10px; padding:5px;
    box-shadow:0 12px 32px var(--shadow);
  }
  .suggest.show{display:block}
  .suggest .row{display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:7px; cursor:pointer; font-size:12.5px}
  .suggest .row.on{background:var(--active)}
  .suggest .row i{font-style:normal; color:var(--accent); width:12px}
  .suggest .row span{margin-left:auto; color:var(--dim); font-size:11px}

  .grid{
    flex:1; overflow-y:auto; padding:12px 14px 8px; display:grid;
    grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; align-content:start;
  }
  .card{aspect-ratio:1; min-width:0; padding:3px; border:2px solid transparent; border-radius:10px; background:var(--surface); cursor:pointer; overflow:hidden; position:relative}
  .card .ph{width:100%; height:100%; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#0b0d10; font-weight:600; font-size:15px; opacity:.92}
  .card.on{border-color:var(--accent); background:var(--active-2)}
  .card .tagline{position:absolute; left:6px; bottom:5px; font-size:9.5px; color:#101318; opacity:.75}

  .empty{display:none; padding:70px 0; text-align:center; color:var(--dim); font-size:13px}
  .empty b{display:block; color:var(--fg); font-weight:500; margin-bottom:6px; font-size:14px}
  .empty.show{display:block}

  .foot{display:flex; align-items:center; gap:16px; padding:8px 16px 10px; border-top:1px solid var(--line); color:var(--dim); font-size:11px; flex-wrap:wrap}
  .foot .sp{flex:1}
  .foot .syntax{color:var(--dim-2)}
  kbd{display:inline-block; margin-right:2px; padding:1px 5px; border:1px solid var(--kbd-border); border-bottom-width:2px; border-radius:4px; background:var(--kbd-bg); color:var(--kbd-fg); font:11px/1.5 inherit}
  .tip{margin-top:2px; color:var(--dim-2); font-size:11.5px; width:820px}
  .tip b{color:var(--dim); font-weight:500}
</style>
</head>
<body>
  <div class="demo-head">
    <b>快贴面板 v2 · 预览</b>
    <span>搜索 15px · 自适应列宽 · 键位提示跟随绑定 · #标签 @分组</span>
    <span class="sp"></span>
    <span>导航键</span>
    <div class="seg" id="seg">
      <button data-k="arrows">方向键</button>
      <button data-k="vim">方向键 + Ctrl HJKL</button>
    </div>
  </div>

  <div class="panel">
    <div class="search-row">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" class="search" placeholder="搜索：名字 / 拼音 / 首字母，或 #标签 @分组" autocomplete="off" spellcheck="false" />
      <span class="count" id="count"></span>
      <div class="suggest" id="suggest"></div>
    </div>

    <div class="tokens" id="tokens"></div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty"><b>没有匹配的表情</b>换个词，试试 <kbd>#</kbd> 列标签、<kbd>@</kbd> 列分组</div>

    <div class="foot" id="foot"></div>
  </div>

  <div class="tip">
    <b>说明</b>：底栏提示由同一份键位表渲染 —— 设置里改四个方向的键，这里自动跟着变；Ctrl+HJKL 默认开。试试输入 <kbd>#浏</kbd>：前缀匹配会同时命中「浏览」和「浏览器」。
  </div>

<script>
const TAGS = ['浏览', '浏览器', '表情包', '蓝毛', '截图', '壁纸', '猫猫', '梗图'];
const GROUPS = ['验收组', '空组验收', '微信', 'QQ'];
const COLORS = ['#9dc4f5','#f2d16b','#f2b28a','#c9b4f2','#a9dfb4','#f2a7b8','#8fd6d0','#e0c9a6'];
const ITEMS = Array.from({ length: 42 }, (_, i) => ({
  id: i + 1,
  name: ['蓝色大肥鱼', '猫猫摸鱼', '截图 2026-11-05', '梗图 狗头', '壁纸 夜景', '表情 震惊'][i % 6] + (i > 5 ? ' ' + (i - 5) : ''),
  tags: [[TAGS[i % TAGS.length]], [TAGS[(i + 2) % TAGS.length], TAGS[(i + 4) % TAGS.length]]][i % 2],
  group: GROUPS[i % GROUPS.length],
  color: COLORS[i % COLORS.length],
  ext: ['GIF', 'PNG', 'JPEG'][i % 3],
}));

const $ = (id) => document.getElementById(id);
const q = $('q'), grid = $('grid'), tokensEl = $('tokens'), suggestEl = $('suggest');
const count = $('count'), empty = $('empty'), foot = $('foot');
let keymap = 'vim';   // Ctrl+HJKL 默认开
let cursor = 0;
let shown = [];
let sugIndex = 0;
let sugItems = [];

/* ---- 键位表：提示文案和实际按键都从这里来 ---- */
const KEYS = {
  arrows: { nav: [['↑↓←→', '选择']], ctrl: [] },
  vim: { nav: [['↑↓←→', '选择'], ['Ctrl HJKL', '选择']], ctrl: [['h', -1, 0], ['l', 1, 0], ['k', 0, -1], ['j', 0, 1]] },
};
const ARROW = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

function kbdify(s) {
  if (s.includes('+')) return s.split('+').map((k) => `<kbd>${k}</kbd>`).join('<span style="color:var(--dim-2)">+</span>');
  return [...s].map((k) => `<kbd>${k}</kbd>`).join('');
}

function footer() {
  const parts = [];
  const dirs = [['↑', 'ArrowUp'], ['↓', 'ArrowDown'], ['←', 'ArrowLeft'], ['→', 'ArrowRight']];
  parts.push(`<span>${dirs.map(([sym]) => `<kbd>${sym}</kbd>`).join('')} 选择</span>`);
  parts.push('<span><kbd>Enter</kbd> 复制</span>');
  parts.push('<span><kbd>Esc</kbd> 关闭</span>');
  parts.push('<span class="sp"></span>');
  parts.push('<span class="syntax"><kbd>#</kbd> 标签 &nbsp;<kbd>@</kbd> 分组 &nbsp;空格分隔</span>');
  foot.innerHTML = parts.join('');
  document.querySelectorAll('#seg button').forEach((b) => b.classList.toggle('on', b.dataset.k === keymap));
}

/* ---- 查询解析：#标签 @分组 其余是文字 ---- */
function parse(raw) {
  const toks = raw.split(/\s+/).filter(Boolean);
  const tags = [], groups = [], words = [];
  for (const t of toks) {
    if (t.length > 1 && t[0] === '#') tags.push(t.slice(1));
    else if (t.length > 1 && t[0] === '@') groups.push(t.slice(1));
    else if (t === '#' || t === '@') continue;   // 正在输入，不算有效 token
    else words.push(t);
  }
  return { tags, groups, words, text: words.join(' ') };
}

/* 最长前缀匹配：输入「浏」既命中「浏览」也命中「浏览器」 */
const prefix = (pool, frag) => pool.filter((t) => t.startsWith(frag));

function matches(it, f) {
  for (const frag of f.tags) {
    const hit = prefix(TAGS, frag);
    if (hit.length) { if (!hit.some((t) => it.tags.includes(t))) return false; }
    else if (!(it.name.includes(frag) || it.tags.join(' ').includes(frag))) return false;  // 没有此标签 → 退回文字搜
  }
  for (const frag of f.groups) {
    const hit = prefix(GROUPS, frag);
    if (hit.length) { if (!hit.includes(it.group)) return false; }
    else if (!it.group.includes(frag)) return false;
  }
  if (f.text && !(it.name.toLowerCase().includes(f.text.toLowerCase()) || it.tags.join(' ').includes(f.text))) return false;
  return true;
}

function chips(f) {
  const rows = [];
  for (const frag of f.tags) {
    const hit = prefix(TAGS, frag);
    if (!hit.length) { rows.push(`<span class="token unknown"><i>#</i><b>${frag}</b> <i>无此标签 · 按文字搜</i></span>`); continue; }
    rows.push(`<span class="token"><i>#</i><b>${frag}</b><span class="hit">→ ${hit.join('、')}</span></span>`);
  }
  for (const frag of f.groups) {
    const hit = prefix(GROUPS, frag);
    if (!hit.length) { rows.push(`<span class="token unknown"><i>@</i><b>${frag}</b> <i>无此分组 · 按文字搜</i></span>`); continue; }
    rows.push(`<span class="token"><i>@</i><b>${frag}</b><span class="hit">→ ${hit.join('、')}</span></span>`);
  }
  if (f.text) rows.push(`<span class="token unknown">包含「${f.text}」</span>`);
  tokensEl.innerHTML = rows.join('');
  tokensEl.classList.toggle('show', rows.length > 0);
}

function render() {
  const f = parse(q.value);
  shown = ITEMS.filter((it) => matches(it, f));
  cursor = Math.min(cursor, Math.max(0, shown.length - 1));
  count.textContent = shown.length ? shown.length + ' 个结果' : '';
  chips(f);
  empty.classList.toggle('show', shown.length === 0);
  grid.innerHTML = shown.map((it, i) =>
    `<div class="card${i === cursor ? ' on' : ''}" data-i="${i}">
       <div class="ph" style="background:${it.color}">${it.id}</div>
       <div class="tagline">${it.tags[0] || ''}</div>
     </div>`).join('');
  const active = grid.children[cursor];
  if (active) active.scrollIntoView({ block: 'nearest' });
}

/* ---- #/@ 补全 ---- */
function suggest() {
  const v = q.value;
  const m = /(^|\s)([#@])([^\s]*)$/.exec(v);
  if (!m) { suggestEl.classList.remove('show'); sugItems = []; return; }
  const mark = m[2], frag = m[3];
  const pool = mark === '#' ? TAGS : GROUPS;
  sugItems = pool.filter((t) => t.includes(frag)).slice(0, 6);
  if (!sugItems.length) { suggestEl.classList.remove('show'); return; }
  sugIndex = 0;
  suggestEl.innerHTML = sugItems.map((t, i) =>
    `<div class="row${i === 0 ? ' on' : ''}" data-i="${i}"><i>${mark}</i>${t}<span>${mark === '#' ? '标签' : '分组'}</span></div>`).join('');
  suggestEl.classList.add('show');
}

function pickSug(i) {
  const v = q.value;
  const m = /(^|\s)([#@])([^\s]*)$/.exec(v);
  const t = sugItems[i];
  if (!m || !t) return;
  q.value = v.slice(0, m.index) + m[1] + m[2] + t + ' ';
  suggestEl.classList.remove('show');
  render();
}

/* ---- 移动 ---- */
function move(dx, dy) {
  if (!shown.length) return;
  const cols = Math.max(1, Math.round(grid.clientWidth / (grid.children[0]?.getBoundingClientRect().width || 1)));
  let next = cursor + dx + dy * cols;
  next = Math.max(0, Math.min(shown.length - 1, next));
  cursor = next;
  render();
}

q.addEventListener('input', () => { cursor = 0; render(); suggest(); });
q.addEventListener('keydown', (e) => {
  if (suggestEl.classList.contains('show') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    sugIndex = (sugIndex + (e.key === 'ArrowDown' ? 1 : -1) + sugItems.length) % sugItems.length;
    [...suggestEl.children].forEach((r, i) => r.classList.toggle('on', i === sugIndex));
    return;
  }
  if (suggestEl.classList.contains('show') && e.key === 'Tab') { e.preventDefault(); pickSug(sugIndex); return; }
  if (suggestEl.classList.contains('show') && e.key === 'Enter') { e.preventDefault(); pickSug(sugIndex); return; }
  if (ARROW[e.key]) { e.preventDefault(); move(...ARROW[e.key]); return; }
  if (e.ctrlKey && keymap === 'vim') {
    const map = { h: [-1, 0], l: [1, 0], k: [0, -1], j: [0, 1] };
    if (map[e.key]) { e.preventDefault(); move(...map[e.key]); }
  }
});
suggestEl.addEventListener('mousedown', (e) => {
  const row = e.target.closest('.row');
  if (row) { e.preventDefault(); pickSug(Number(row.dataset.i)); q.focus(); }
});
grid.addEventListener('click', (e) => {
  const c = e.target.closest('.card');
  if (c) { cursor = Number(c.dataset.i); render(); }
});
document.querySelectorAll('#seg button').forEach((b) => b.addEventListener('click', () => { keymap = b.dataset.k; footer(); q.focus(); }));

footer();
render();
q.focus();
</script>
</body>
</html>
